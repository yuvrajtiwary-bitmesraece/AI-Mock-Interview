name: Verdict

# Tests Verdict, the Go code judge in verdict/: formatting, vet, unit tests
# with the race detector, a short fuzz run of the output checker, the C++
# sandbox image and the Docker integration suite, on x64 and arm64.

on:
  push:
    branches: [main]
    paths:
      - "verdict/**"
      - ".github/workflows/verdict.yml"
  pull_request:
    paths:
      - "verdict/**"
      - ".github/workflows/verdict.yml"

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: verdict-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: verdict

jobs:
  test:
    name: Verdict (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: verdict/go.mod
          cache-dependency-path: verdict/go.sum

      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi

      - name: Vet
        run: go vet ./... && go vet -tags integration ./...

      - name: Generated tests are up to date
        run: |
          for gen in problems/*/gen; do go run "./$gen" -dir "$(dirname "$gen")"; done
          git status --porcelain -- problems/
          test -z "$(git status --porcelain -- problems/)"

      - name: Unit tests (race detector)
        run: go test -race -count=1 ./...

      - name: Fuzz the output checker
        run: go test -run='^$' -fuzz=FuzzCheck -fuzztime=30s ./internal/judge/

      - name: Build the C++ sandbox image
        run: docker build -f images/cpp/Dockerfile -t verdict-cpp:dev .

      - name: Integration tests (runc)
        run: go test -tags integration -count=1 -v ./internal/judge/

      - name: No sandbox containers left behind
        if: always()
        run: test -z "$(docker ps --all --quiet --filter label=verdict=1)"
